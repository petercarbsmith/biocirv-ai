[workspace]
name = "biocirv-ai"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"
nodejs = ">=18"
pandas = ">=2.2,<3"
scipy = ">=1.10.1,<1.11"
matplotlib = ">=3.7.1,<3.8"
pillow = ">=10.1.0,<11.0.0"
packaging = "<25"
requests = "*"
python-dotenv = "*"
sqlalchemy = ">=2.0.0"
plotly = "*"
psycopg2-binary = "*"
google-cloud-secret-manager = "*"

[pypi-dependencies]
ca-biositing-ai-exploration = { path = ".", editable = true }
pandasai = ">=3.0.0"
pandasai-sql = ">=0.1.0"
pg8000 = "*"
cloud-sql-python-connector = { version = "*", extras = ["pg8000"] }

[feature.gis.dependencies]
geopandas = "*"
folium = "*"
shapely = "*"
pyproj = "*"

[feature.dev.dependencies]
pytest = "*"
pre-commit = "*"
ipykernel = "*"
ipywidgets = "*"

[environments]
default = ["gis", "dev"]

[tasks]
kernel-install = "python -m ipykernel install --user --name biocirv-ai --display-name 'Python (BioCirv AI)'"
test = "pytest tests/"
pre-commit-all = "pre-commit run --all-files"
pre-commit-install = "pre-commit install"
check-env = "python -c 'import os; from dotenv import load_dotenv; load_dotenv(); print(\"CBORG Model:\", os.getenv(\"CBORG_MODEL\", \"Not Found\"))'"
